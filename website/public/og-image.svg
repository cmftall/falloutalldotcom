    <tspan x="320" dy="30">Fortune 500 transformations. I design cloud-native solutions</tspan>
    <tspan x="320" dy="30">that process petabytes of data while reducing costs by 40%</tspan>
    <tspan x="320" dy="30">and improving insights delivery by 60%.</tspan>
  </text>
  
  <!-- Location -->
  <text x="320" y="420" fill="#64748B" font-family="Inter, sans-serif" font-size="16">Paris, France • Montreal, Canada</text>
  
  <!-- Tech Stack -->
  <text x="320" y="450" fill="#64748B" font-family="Inter, sans-serif" font-size="14">Azure • AWS • Databricks • Python • Spark • SQL</text>
